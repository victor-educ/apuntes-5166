site_name: Despliegue de plataformas de contenedores
site_description: Apuntes de la asignatura Despliegue de plataformas de ejecución de contenedores. Virtualización, VPC, seguridad por capas, nube pública, IaC, CI/CD y monitorización.
site_url: https://victor-educ.github.io/apuntes-5166/
repo_url: https://github.com/victor-educ/apuntes-5166
repo_name: victor-educ/apuntes-5166
edit_uri: edit/main/docs/
copyright: Víctor Sellés · CC BY-SA 4.0

theme:
  name: material
  custom_dir: overrides
  language: es
  icon:
    logo: material/package-variant-closed
    repo: fontawesome/brands/github
  favicon: assets/logo.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  font:
    text: Inter
    code: JetBrains Mono

extra:
  version: !ENV [SITE_VERSION, "local"]
  commit: !ENV [SITE_COMMIT, ""]
  nav_icons:
    Inicio: material/home
    Presentación y evaluación: material/school
    Calendario: material/calendar-month
    Laboratorio: material/flask
    Unidades: material/book-open-page-variant
    Recursos: material/toolbox
    UT1 · Virtualización e hipervisores: material/server
    UT2 · Nubes privadas virtuales (VPC): material/lan
    UT3 · Seguridad por capas: material/shield-lock
    UT4 · Nube pública (empresa): material/cloud
    UT5 · Infraestructura como código: material/code-braces
    UT6 · Integración continua: material/pipe
    UT7 · Monitorización: material/chart-line
    Chuleta de comandos: material/console
    Glosario: material/book-alphabet
    Bibliografía y enlaces: material/link-variant

extra_javascript:
  - assets/calendario.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search:
      lang: es

nav:
  - Inicio: index.md
  - Unidades:
      - UT1 · Virtualización e hipervisores: ut/ut1-virtualizacion.md
      - UT2 · Nubes privadas virtuales (VPC): ut/ut2-vpc.md
      - UT3 · Seguridad por capas: ut/ut3-seguridad-por-capas.md
      - UT4 · Nube pública (empresa): ut/ut4-nube-publica.md
      - UT5 · Infraestructura como código: ut/ut5-iac.md
      - UT6 · Integración continua: ut/ut6-ci.md
      - UT7 · Monitorización: ut/ut7-monitorizacion.md
  - Calendario: calendario.md
  - Recursos:
      - Presentación y evaluación: modulo.md
      - Laboratorio: laboratorio.md
      - Chuleta de comandos: chuleta.md
      - Glosario: glosario.md
      - Bibliografía y enlaces: recursos.md
